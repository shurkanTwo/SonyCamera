name: Build and verify native Sony driver
on:
  push:
    branches: [workerThread, 'maintenance/**']
  pull_request:
    branches: [workerThread]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned dependencies and unchanged native driver
        shell: pwsh
        run: ./build/Build-Native.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.architecture }}
          path: |
            .build/output/${{ matrix.architecture }}/*.dll
            .build/output/${{ matrix.architecture }}/*.exe
            .build/output/${{ matrix.architecture }}/BUILD.json
          if-no-files-found: warn
